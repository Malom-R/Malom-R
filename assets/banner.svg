<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset="1" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- network topology -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity=".55">
    <line x1="820" y1="70" x2="930" y2="130"/><line x1="930" y1="130" x2="1060" y2="80"/>
    <line x1="930" y1="130" x2="900" y2="230"/><line x1="900" y1="230" x2="1040" y2="220"/>
    <line x1="1060" y1="80" x2="1040" y2="220"/><line x1="820" y1="70" x2="760" y2="190"/>
    <line x1="760" y1="190" x2="900" y2="230"/>
  </g>
  <g fill="#0b1f3a" stroke="#38bdf8" stroke-width="2">
    <circle cx="820" cy="70" r="7"/><circle cx="1060" cy="80" r="7"/>
    <circle cx="760" cy="190" r="7"/><circle cx="900" cy="230" r="7"/><circle cx="1040" cy="220" r="7"/>
  </g>
  <circle cx="1040" cy="220" r="7" fill="#f43f5e" stroke="#f43f5e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>

  <!-- shield (domain controller) -->
  <g transform="translate(900 92)">
    <path d="M30 0 L60 12 V38 C60 58 46 72 30 78 C14 72 0 58 0 38 V12 Z" fill="url(#shield)"/>
    <path d="M17 39 l9 9 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- text -->
  <text x="60" y="118" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700">Malom-R</text>
  <text x="60" y="165" fill="#38bdf8" font-family="Consolas, Menlo, monospace" font-size="24">Blue Team · Network Security · Active Directory</text>
  <text x="60" y="210" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="18">$ detect --respond --harden</text>
  <rect x="373" y="196" width="11" height="18" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
